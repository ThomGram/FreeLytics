name: 'freelytics'

config-version: 2
version: '1.0'

profile: 'freelytics'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analysis"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
    - "target"
    - "dbt_modules"
    - "logs"


seeds:
  +docs:
    node_color: '#cd7f32'

models:
  market:
    +materialized: table
    +docs:
      node_color: 'gold'
  staging:
    +materialized: view
    +docs:
      node_color: 'bronze'
  intermediate:
    +materialized: view
    +docs:
      node_color: 'silver'
