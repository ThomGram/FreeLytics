repos:
  # Python linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests]
        args: ["--ignore-missing-imports"]

  # Security linting
  - repo: https://github.com/pycqa/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ["-r"]
        files: ^(src|airflow/dags)/
        exclude: tests/

  # General pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: debug-statements

  # Application-specific checks
  - repo: local
    hooks:
      - id: scrapy-settings-check
        name: Check Scrapy settings
        entry: python -c "import sys; sys.path.append('src/scrapy_freework'); from scrapy_freework import settings; print('Scrapy settings OK')"
        language: system
        files: src/scrapy_freework/settings\.py$
        pass_filenames: false

      - id: pytest-all
        name: Run all tests
        entry: uv run pytest tests/ -v --tb=short
        language: system
        files: ^(src|tests)/.*\.py$
        pass_filenames: false
